<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... - myPilotPost Blog</title>
    
    <!-- Meta Tags for SEO - Will be updated dynamically -->
    <meta name="description" content="">
    <meta name="author" content="myPilotPost">
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:type" content="article">
    <meta property="og:url" content="">
    <meta property="og:image" content="">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="">
    <meta name="twitter:description" content="">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../images/favicon-32x32.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Copy all the same CSS from resources.html up to the main content area */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            line-height: 1.15;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            color: #1a1a1a;
            background: #ffffff;
            overflow-x: hidden;
        }

        :root {
            --primary-blue: #2563EB;
            --dark-blue: #1D4ED8;
            --text-dark: #000000;
            --text-gray: #646565;
            --light-gray: #EEF0F1;
            --border-gray: #CECECE;
            --white: #FFFFFF;
            --success-green: #35C961;
            
            --space-unit: 16px;
            --space-half: 8px;
            --space-onehalf: 24px;
            --space-two: 32px;
            --space-three: 48px;
            --space-four: 64px;
            --space-five: 80px;
            
            --radius-small: 4px;
            --radius-medium: 8px;
            --radius-large: 14px;
            --radius-xl: 24px;
            
            --container-width: 1280px;
            --container-padding: 20px;
        }

        .container {
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 var(--container-padding);
            width: 100%;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: var(--radius-medium);
            font-weight: 500;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            text-decoration: none;
        }

        .btn--primary {
            background: var(--primary-blue);
            color: var(--white);
        }

        .btn--primary:hover {
            background: var(--dark-blue);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }

        .btn--secondary {
            background: transparent;
            border: 1px solid var(--border-gray);
            color: var(--text-gray);
        }

        .btn--secondary:hover {
            background: var(--light-gray);
            transform: translateY(-2px);
        }

        .header {
            position: sticky;
            top: 0;
            background: var(--white);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            z-index: 1000;
            padding: 20px 0;
        }

        .header__container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            width: 272px;
            height: 54px;
            background-image: url('../images/myPilotPost-Logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
        }

        .nav-menu {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .nav-menu__item {
            font-size: 18px;
            color: var(--text-gray);
            cursor: pointer;
            transition: color 0.3s;
            text-decoration: none;
        }

        .nav-menu__item:hover {
            color: var(--primary-blue);
        }

        .header__buttons {
            display: flex;
            gap: 20px;
        }

        .mobile-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            padding: 10px;
        }

        .mobile-toggle span {
            width: 25px;
            height: 3px;
            background: var(--text-dark);
            margin: 3px 0;
            transition: 0.3s;
        }

        .mobile-menu {
            display: none;
        }

        /* Blog Post Styles */
        .blog-post {
            max-width: 800px;
            margin: var(--space-five) auto;
            padding: 0 var(--container-padding);
        }

        .blog-post__header {
            margin-bottom: var(--space-three);
        }

        .blog-post__title {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: var(--space-unit);
        }

        .blog-post__meta {
            color: var(--text-gray);
            font-size: 16px;
            display: flex;
            gap: var(--space-unit);
            align-items: center;
            flex-wrap: wrap;
        }

        .blog-post__featured-image {
            width: 100%;
            height: 400px;
            background-size: cover;
            background-position: center;
            border-radius: var(--radius-medium);
            margin-bottom: var(--space-three);
        }

        .blog-post__content {
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-dark);
        }

        .blog-post__content h2 {
            font-size: 32px;
            margin: var(--space-two) 0 var(--space-unit);
        }

        .blog-post__content h3 {
            font-size: 24px;
            margin: var(--space-onehalf) 0 var(--space-half);
        }

        .blog-post__content p {
            margin-bottom: var(--space-unit);
        }

        .blog-post__content img {
            max-width: 100%;
            border-radius: var(--radius-medium);
            margin: var(--space-unit) 0;
        }

        .blog-post__content blockquote {
            border-left: 4px solid var(--primary-blue);
            padding: var(--space-unit) var(--space-two);
            background: var(--light-gray);
            margin: var(--space-unit) 0;
            font-style: italic;
        }

        .blog-post__content ul, 
        .blog-post__content ol {
            margin: var(--space-unit) 0 var(--space-unit) var(--space-two);
        }

        .blog-post__content li {
            margin-bottom: var(--space-half);
        }

        .blog-post__footer {
            margin-top: var(--space-four);
            padding-top: var(--space-two);
            border-top: 1px solid var(--border-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .blog-post__share {
            display: flex;
            gap: var(--space-unit);
        }

        .share-link {
            color: var(--text-gray);
            transition: color 0.3s;
        }

        .share-link:hover {
            color: var(--primary-blue);
        }

        .loading-spinner {
            border: 4px solid var(--light-gray);
            border-top: 4px solid var(--primary-blue);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: var(--space-four) auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-container {
            text-align: center;
            padding: var(--space-four);
        }

        .error-container h1 {
            color: #EF4444;
            margin-bottom: var(--space-unit);
        }

        /* Footer */
        .footer {
            background: #002F86;
            color: var(--white);
            padding: var(--space-five) 0 var(--space-three);
            margin-top: var(--space-five);
        }

        .footer__copyright {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .nav-menu, .header__buttons {
                display: none;
            }

            .mobile-toggle {
                display: flex;
            }

            .mobile-menu {
                display: block;
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                max-width: 400px;
                height: 100vh;
                background: var(--white);
                box-shadow: -2px 0 20px rgba(0, 0, 0, 0.1);
                z-index: 1001;
                padding: 80px 30px;
                transition: right 0.3s ease;
            }

            .mobile-menu.active {
                right: 0;
            }

            .mobile-menu__item {
                display: block;
                padding: 15px 0;
                font-size: 18px;
                color: var(--text-dark);
                text-decoration: none;
                border-bottom: 1px solid var(--border-gray);
            }

            .mobile-menu__buttons {
                margin-top: 30px;
                display: flex;
                flex-direction: column;
                gap: 15px;
            }

            .blog-post__title {
                font-size: 36px;
            }

            .blog-post__featured-image {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
        <a href="../index.html" class="mobile-menu__item">Home</a>
        <a href="../features.html" class="mobile-menu__item">Features</a>
        <a href="../solutions.html" class="mobile-menu__item">Solutions</a>
        <a href="../resources.html" class="mobile-menu__item">Resources</a>
        <div class="mobile-menu__buttons">
            <a href="../signin.html"><button class="btn btn--secondary">Sign In →</button></a>
            <a href="../register.html"><button class="btn btn--primary">Get Started</button></a>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="container header__container">
            <div class="logo" onclick="window.location.href='../index.html'" aria-label="myPilotPost Logo"></div>
            
            <nav class="nav-menu" aria-label="Main Navigation">
                <a href="../index.html" class="nav-menu__item">Home</a>
                <a href="../features.html" class="nav-menu__item">Features</a>
                <a href="../solutions.html" class="nav-menu__item">Solutions</a>
                <a href="../resources.html" class="nav-menu__item">Resources</a>
            </nav>

            <div class="header__buttons">
                <button class="btn btn--secondary" onclick="window.location.href='../signin.html'">
                    Sign In
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4.1665 10H15.8332" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M10 4.16667L15.8333 10L10 15.8333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="btn btn--primary" onclick="window.location.href='../register.html'">
                    Get Started
                </button>
            </div>

            <div class="mobile-toggle" onclick="toggleMobileMenu()" aria-label="Toggle mobile menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- Blog Post Content -->
    <main>
        <article class="blog-post">
            <div class="blog-post__header">
                <h1 id="title" class="blog-post__title">Loading...</h1>
                <div id="meta" class="blog-post__meta"></div>
            </div>
            <div id="featured-image" class="blog-post__featured-image" style="display: none;"></div>
            <div id="content" class="blog-post__content">
                <div class="loading-spinner"></div>
            </div>
            <div class="blog-post__footer" style="display: none;">
                <div class="blog-post__share">
                    <span>Share:</span>
                    <a href="#" class="share-link" onclick="shareOnTwitter()">Twitter</a>
                    <a href="#" class="share-link" onclick="shareOnLinkedIn()">LinkedIn</a>
                    <a href="#" class="share-link" onclick="shareOnFacebook()">Facebook</a>
                </div>
                <a href="../resources.html" class="btn btn--secondary">← Back to Resources</a>
            </div>
        </article>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer__copyright">© 2026 myPilotPost. All rights reserved.</div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('active');
            document.body.style.overflow = menu.classList.contains('active') ? 'hidden' : 'auto';
        }

        function closeMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('mobileMenu');
            const toggle = document.querySelector('.mobile-toggle');
            
            if (!menu.contains(event.target) && !toggle.contains(event.target) && menu.classList.contains('active')) {
                closeMobileMenu();
            }
        });

        document.querySelectorAll('.mobile-menu__item, .mobile-menu__buttons .btn').forEach(link => {
            link.addEventListener('click', closeMobileMenu);
        });

        // Get slug from URL
        const slug = window.location.pathname.split('/').pop().replace('.html', '');

        // Format date function
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('en-US', options);
        }

        // Share functions
        function shareOnTwitter() {
            const title = document.getElementById('title').innerText;
            const url = window.location.href;
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`, '_blank');
        }

        function shareOnLinkedIn() {
            const url = window.location.href;
            window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`, '_blank');
        }

        function shareOnFacebook() {
            const url = window.location.href;
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank');
        }

        // Load blog post
        async function loadPost() {
            try {
                const res = await fetch(`https://api.mypilotpost.com/api/public/blog/${slug}`);
                
                if (res.status === 404) {
                    document.body.innerHTML = `
                        <div style="text-align: center; padding: 100px 20px;">
                            <h1 style="color: #EF4444; margin-bottom: 20px;">Post not found</h1>
                            <p>The article you're looking for doesn't exist or has been moved.</p>
                            <a href="../resources.html" class="btn btn--primary" style="margin-top: 30px;">← Back to Resources</a>
                        </div>
                    `;
                    return;
                }

                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }

                const data = await res.json();
                const post = data.post;

                // Update page title
                document.title = `${post.seo_title || post.title} - myPilotPost Blog`;

                // Update meta tags
                const metaDesc = document.querySelector('meta[name="description"]');
                metaDesc.setAttribute('content', post.seo_description || post.excerpt || '');

                // Update Open Graph tags
                document.querySelector('meta[property="og:title"]').setAttribute('content', post.title);
                document.querySelector('meta[property="og:description"]').setAttribute('content', post.excerpt || '');
                document.querySelector('meta[property="og:url"]').setAttribute('content', window.location.href);
                if (post.featured_image_url) {
                    document.querySelector('meta[property="og:image"]').setAttribute('content', post.featured_image_url);
                }

                // Update Twitter Card
                document.querySelector('meta[name="twitter:title"]').setAttribute('content', post.title);
                document.querySelector('meta[name="twitter:description"]').setAttribute('content', post.excerpt || '');

                // Update canonical URL
                document.querySelector('link[rel="canonical"]').setAttribute('content', window.location.href);

                // Update content
                document.getElementById('title').innerText = post.title;
                document.getElementById('meta').innerHTML = `
                    <span>by ${post.author_name || 'Admin'}</span>
                    <span>·</span>
                    <span>${formatDate(post.published_at)}</span>
                    ${post.reading_time ? `<span>·</span><span>${post.reading_time} min read</span>` : ''}
                `;

                if (post.featured_image_url) {
                    const featuredImage = document.getElementById('featured-image');
                    featuredImage.style.backgroundImage = `url('${post.featured_image_url}')`;
                    featuredImage.style.display = 'block';
                }

                document.getElementById('content').innerHTML = post.content_html || post.content;
                document.querySelector('.blog-post__footer').style.display = 'flex';

            } catch (error) {
                console.error('Error loading blog post:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error-container">
                        <h1>Error Loading Article</h1>
                        <p>Failed to load the article. Please try again later.</p>
                        <a href="../resources.html" class="btn btn--primary" style="margin-top: 20px;">← Back to Resources</a>
                    </div>
                `;
            }
        }

        // Load post when page loads
        document.addEventListener('DOMContentLoaded', loadPost);
    </script>
</body>
</html>
