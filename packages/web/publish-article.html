<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketing Blog Admin — myPilotPost</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#2563eb;
  --red:#ef4444;
  --green:#10b981;
  --bg:#f8fafc;
  --border:#e2e8f0;
  --text:#0f172a;
  --muted:#64748b;
}
*{box-sizing:border-box;font-family:'Inter',sans-serif}
body{margin:0;background:var(--bg);padding:40px;position:relative;}
h1{margin-bottom:24px}
.wrapper{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.card{
  background:#fff;
  padding:24px;
  border-radius:12px;
  border:1px solid var(--border);
  box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);
}
input,textarea,select{
  width:100%;
  padding:10px;
  margin-bottom:12px;
  border:1px solid var(--border);
  border-radius:8px;
  font-size:14px;
}
input:focus,textarea:focus,select:focus{
  outline:2px solid var(--blue);
  outline-offset:2px;
}
textarea{min-height:200px;resize:vertical}
.button-group{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:16px;
}
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
  transition:all 0.2s ease;
}
button:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);
}
button:active{
  transform:translateY(0);
}
.primary{
  background:var(--blue);
  color:#fff;
}
.primary:hover{
  background:#1d4ed8;
}
.danger{
  background:var(--red);
  color:#fff;
}
.danger:hover{
  background:#dc2626;
}
.secondary{
  background:#fff;
  border:1px solid var(--border);
  color:var(--text);
}
.secondary:hover{
  background:var(--bg);
}
.preview{
  border:1px dashed var(--border);
  padding:16px;
  margin-bottom:20px;
  border-radius:8px;
  background:#fff;
  min-height:100px;
}
.post-item{
  border:1px solid var(--border);
  padding:16px;
  border-radius:8px;
  margin-bottom:12px;
  background:#fff;
  transition:all 0.2s ease;
}
.post-item:hover{
  box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);
}
.post-header{
  display:flex;
  justify-content:space-between;
  align-items:start;
  margin-bottom:8px;
}
.post-title{
  font-weight:600;
  color:var(--text);
}
.meta{
  font-size:12px;
  color:var(--muted);
  margin:4px 0 8px;
}
.status-badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:9999px;
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
}
.status-draft{
  background:#fef3c7;
  color:#92400e;
}
.status-published{
  background:#d1fae5;
  color:#065f46;
}
.post-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}
.loading{
  text-align:center;
  padding:20px;
  color:var(--muted);
}
.error{
  background:#fee2e2;
  color:#991b1b;
  padding:12px;
  border-radius:8px;
  margin-bottom:12px;
}
.success{
  background:#d1fae5;
  color:#065f46;
  padding:12px;
  border-radius:8px;
  margin-bottom:12px;
}

/* Login Modal Styles */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  background: white;
  padding: 32px;
  border-radius: 16px;
  width: 90%;
  max-width: 400px;
  box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
}

.modal h2 {
  margin-top: 0;
  margin-bottom: 24px;
  color: var(--text);
}

.modal .button-group {
  margin-top: 24px;
  display: flex;
  gap: 12px;
}

.modal .button-group button {
  flex: 1;
}

.close-btn {
  position: absolute;
  top: 16px;
  right: 16px;
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--muted);
}

.close-btn:hover {
  color: var(--text);
  transform: none;
  box-shadow: none;
}

.auth-status {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  margin-left: 16px;
}

.auth-status.logged-in {
  background: #d1fae5;
  color: #065f46;
}

.auth-status.logged-out {
  background: #fee2e2;
  color: #991b1b;
}

.header-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.header-container h1 {
  margin-bottom: 0;
}

.auth-section {
  display: flex;
  align-items: center;
  gap: 12px;
}
</style>
</head>

<body>

<!-- Login Modal -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <button class="close-btn" onclick="closeLoginModal()">&times;</button>
    <h2>Login to Admin</h2>
    <input type="email" id="loginEmail" placeholder="Email" value="admin@mypilotpost.com" />
    <input type="password" id="loginPassword" placeholder="Password" />
    <div class="button-group">
      <button class="secondary" onclick="closeLoginModal()">Cancel</button>
      <button class="primary" onclick="handleLogin()">Login</button>
    </div>
    <div id="loginMessage" style="margin-top:16px;"></div>
  </div>
</div>

<div class="header-container">
  <h1>📝 Marketing Blog Admin</h1>
  <div class="auth-section">
    <span id="authStatus" class="auth-status logged-out">Not logged in</span>
    <button class="secondary" onclick="showLoginModal()" id="loginBtn">Login</button>
    <button class="secondary" onclick="logout()" id="logoutBtn" style="display:none;">Logout</button>
  </div>
</div>

<div class="wrapper">

<!-- EDITOR -->
<div class="card">
  <h3 style="margin-top:0;margin-bottom:16px;">Article Editor</h3>
  
  <form id="publishForm">
    <input id="title" placeholder="Article Title" autocomplete="off" required />
    <input id="slug" placeholder="Slug (auto-generated)" autocomplete="off" />
    <input id="category" placeholder="Category (e.g., 'Content Strategy')" autocomplete="off" />
    <input id="featured_image" placeholder="Featured Image URL" autocomplete="off" />
    <input id="excerpt" placeholder="Excerpt (short description)" autocomplete="off" />
    <textarea id="content_html" placeholder="Write article HTML here..." required></textarea>
  </form>
  
  <div class="button-group">
    <button class="secondary" onclick="saveDraft()">💾 Save Draft</button>
    <button class="primary" onclick="publish()">📤 Publish</button>
    <button class="secondary" onclick="clearForm()">🗑️ Clear Form</button>
    <button class="secondary" onclick="loadPosts()">🔄 Refresh Posts</button>
  </div>
  
  <div id="message" style="margin-top:16px;"></div>
</div>

<!-- PREVIEW + POSTS -->
<div class="card">
  <h3 style="margin-top:0;margin-bottom:16px;">Live Preview</h3>
  <div class="preview" id="preview">
    <p style="color:var(--muted);">Preview will appear here...</p>
  </div>

  <h3 style="margin-bottom:16px;">All Posts</h3>
  <div id="postList">
    <div class="loading">Loading posts...</div>
  </div>
</div>

</div>

<script>

/* ================= CONFIG ================= */

const API_BASE = "https://mypilotpost-api.littchel.workers.dev";
let TOKEN = localStorage.getItem("authToken");

/* ================= DOM ELEMENTS ================= */

const titleEl = document.getElementById("title");
const slugEl = document.getElementById("slug");
const categoryEl = document.getElementById("category");
const featuredEl = document.getElementById("featured_image");
const excerptEl = document.getElementById("excerpt");
const contentEl = document.getElementById("content_html");
const previewEl = document.getElementById("preview");
const postListEl = document.getElementById("postList");
const messageEl = document.getElementById("message");
const authStatusEl = document.getElementById("authStatus");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const loginModal = document.getElementById("loginModal");
const loginEmail = document.getElementById("loginEmail");
const loginPassword = document.getElementById("loginPassword");
const loginMessage = document.getElementById("loginMessage");

// Store current editing ID
let currentEditId = null;

/* ================= AUTH FUNCTIONS ================= */

function updateAuthUI() {
  if (TOKEN) {
    authStatusEl.textContent = "Logged in";
    authStatusEl.className = "auth-status logged-in";
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
  } else {
    authStatusEl.textContent = "Not logged in";
    authStatusEl.className = "auth-status logged-out";
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
  }
}

function showLoginModal() {
  loginModal.classList.add('active');
  loginEmail.value = "admin@mypilotpost.com";
  loginPassword.value = "";
  loginMessage.innerHTML = "";
}

function closeLoginModal() {
  loginModal.classList.remove('active');
}

async function handleLogin() {
  const email = loginEmail.value.trim();
  const password = loginPassword.value.trim();
  
  if (!email || !password) {
    loginMessage.innerHTML = '<div class="error">Email and password required</div>';
    return;
  }
  
  loginMessage.innerHTML = '<div class="loading">Logging in...</div>';
  
  try {
    const res = await fetch(`${API_BASE}/api/customer/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "Login failed");
    }

    TOKEN = data.token;
    localStorage.setItem("authToken", TOKEN);
    
    loginMessage.innerHTML = '<div class="success">Login successful!</div>';
    updateAuthUI();
    
    setTimeout(() => {
      closeLoginModal();
      loadPosts(); // Load posts after successful login
    }, 1000);
    
  } catch (error) {
    console.error("Login error:", error);
    loginMessage.innerHTML = `<div class="error">${error.message}</div>`;
  }
}

function logout() {
  TOKEN = null;
  localStorage.removeItem("authToken");
  updateAuthUI();
  postListEl.innerHTML = '<div class="loading">Please login to view posts</div>';
  clearForm();
  showMessage("Logged out successfully");
}

/* ================= HELPER FUNCTIONS ================= */

function showMessage(text, type = "success") {
  messageEl.innerHTML = `<div class="${type}">${text}</div>`;
  setTimeout(() => {
    messageEl.innerHTML = "";
  }, 3000);
}

function slugify(text) {
  if (!text) return "";
  return text.toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}

// Auto-generate slug from title
titleEl.addEventListener("input", () => {
  if (!slugEl.value || slugEl.value === slugify(titleEl.value)) {
    slugEl.value = slugify(titleEl.value);
  }
});

// Live preview
function updatePreview() {
  const title = titleEl.value || "Article Title";
  const content = contentEl.value || "<p>Start writing your article...</p>";
  
  previewEl.innerHTML = `
    <h2 style="margin-top:0;margin-bottom:16px;">${title}</h2>
    ${content}
  `;
}

contentEl.addEventListener("input", updatePreview);
titleEl.addEventListener("input", updatePreview);

function collectFormData() {
  let title = titleEl.value.trim();
  let slug = slugEl.value.trim();
  
  if (!slug && title) {
    slug = slugify(title);
  }
  
  if (!title) {
    throw new Error("Title is required");
  }
  
  return {
    slug: slug || slugify(title),
    title: title,
    excerpt: excerptEl.value.trim() || title.substring(0, 150) + "...",
    content_html: contentEl.value.trim() || "<p></p>",
    category: categoryEl.value.trim() || "Uncategorized",
    featured_image: featuredEl.value.trim() || "https://via.placeholder.com/1200x630",
    status: "draft", // Will be overridden by saveDraft or publish
    published_at: new Date().toISOString(),
    author: "myPilotPost Team"
  };
}

async function request(method, url, body = null) {
  if (!TOKEN) {
    throw new Error("Not logged in");
  }
  
  const options = {
    method,
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${TOKEN}`
    }
  };
  
  if (body) {
    options.body = JSON.stringify(body);
  }
  
  try {
    const res = await fetch(url, options);
    
    if (res.status === 401) {
      // Token expired or invalid
      logout();
      throw new Error("Session expired. Please login again.");
    }
    
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`HTTP ${res.status}: ${text || res.statusText}`);
    }
    
    // Check if response is empty
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  } catch (error) {
    console.error("Request failed:", error);
    showMessage(error.message, "error");
    throw error;
  }
}

/* ================= CRUD OPERATIONS ================= */

async function saveDraft() {
  if (!TOKEN) {
    showLoginModal();
    return;
  }
  
  try {
    const data = collectFormData();
    data.status = "draft";
    
    if (currentEditId) {
      // Update existing post
      await request("PATCH", `${API_BASE}/api/customer/marketing/blog/${currentEditId}`, data);
      showMessage("Draft updated successfully!");
    } else {
      // Create new draft
      await request("POST", `${API_BASE}/api/customer/marketing/blog`, data);
      showMessage("Draft saved successfully!");
    }
    
    clearForm();
    await loadPosts();
  } catch (error) {
    console.error("Save draft error:", error);
  }
}

async function publish() {
  if (!TOKEN) {
    showLoginModal();
    return;
  }
  
  try {
    const data = collectFormData();
    data.status = "published";
    
    if (currentEditId) {
      // Update and publish existing post
      await request("PATCH", `${API_BASE}/api/customer/marketing/blog/${currentEditId}`, data);
      showMessage("Post updated and published!");
    } else {
      // Create new published post
      await request("POST", `${API_BASE}/api/customer/marketing/blog`, data);
      showMessage("Post published successfully!");
    }
    
    clearForm();
    await loadPosts();
  } catch (error) {
    console.error("Publish error:", error);
  }
}

async function publishExisting(id) {
  if (!TOKEN) {
    showLoginModal();
    return;
  }
  
  try {
    await request("PATCH", `${API_BASE}/api/customer/marketing/blog/${id}`, { 
      status: "published",
      published_at: new Date().toISOString() 
    });
    showMessage("Post published successfully!");
    await loadPosts();
  } catch (error) {
    console.error("Publish existing error:", error);
  }
}

async function deletePost(id) {
  if (!TOKEN) {
    showLoginModal();
    return;
  }
  
  if (!confirm("Are you sure you want to delete this post? This action cannot be undone.")) {
    return;
  }
  
  try {
    await request("DELETE", `${API_BASE}/api/customer/marketing/blog/${id}`);
    showMessage("Post deleted successfully!");
    
    if (currentEditId === id) {
      clearForm();
    }
    
    await loadPosts();
  } catch (error) {
    console.error("Delete error:", error);
  }
}

async function editPost(id) {
  if (!TOKEN) {
    showLoginModal();
    return;
  }
  
  try {
    // Get single post
    const post = await request("GET", `${API_BASE}/api/customer/marketing/blog/${id}`);
    
    if (!post) {
      showMessage("Post not found", "error");
      return;
    }
    
    // Handle different response formats
    const postData = post.post || post;
    
    // Populate form
    titleEl.value = postData.title || "";
    slugEl.value = postData.slug || "";
    categoryEl.value = postData.category || "";
    featuredEl.value = postData.featured_image || "";
    excerptEl.value = postData.excerpt || "";
    contentEl.value = postData.content_html || "";
    
    // Update preview
    updatePreview();
    
    // Set current edit ID
    currentEditId = id;
    
    showMessage("Post loaded for editing");
    
    // Scroll to editor
    document.querySelector('.card').scrollIntoView({ behavior: 'smooth' });
  } catch (error) {
    console.error("Edit error:", error);
  }
}

async function loadPosts() {
  if (!TOKEN) {
    postListEl.innerHTML = '<div class="error">Please login to view posts</div>';
    return;
  }
  
  try {
    postListEl.innerHTML = '<div class="loading">Loading posts...</div>';
    
    const response = await request("GET", `${API_BASE}/api/customer/marketing/blog`);
    
    // Handle different response formats
    let posts = [];
    if (response.posts) {
      posts = response.posts;
    } else if (response.results) {
      posts = response.results;
    } else if (Array.isArray(response)) {
      posts = response;
    } else {
      posts = [];
    }
    
    if (!posts || posts.length === 0) {
      postListEl.innerHTML = '<p style="color:var(--muted);">No posts yet. Create your first post!</p>';
      return;
    }
    
    // Sort by date (newest first)
    posts.sort((a, b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at));
    
    postListEl.innerHTML = "";
    
    posts.forEach(post => {
      const div = document.createElement("div");
      div.className = "post-item";
      
      const postDate = post.published_at || post.created_at;
      const formattedDate = postDate ? new Date(postDate).toLocaleDateString() : 'Unknown date';
      const statusClass = post.status === 'published' ? 'status-published' : 'status-draft';
      const statusText = post.status === 'published' ? 'Published' : 'Draft';
      
      div.innerHTML = `
        <div class="post-header">
          <span class="post-title">${post.title || 'Untitled'}</span>
          <span class="status-badge ${statusClass}">${statusText}</span>
        </div>
        <div class="meta">
          ${post.slug || 'no-slug'} • ${formattedDate}
          ${post.category ? ` • ${post.category}` : ''}
          ${post.author ? ` • Author: ${post.author}` : ''}
        </div>
        <div class="post-actions">
          <button class="secondary" onclick="editPost('${post.id}')">✏️ Edit</button>
          ${post.status !== 'published' ? 
            `<button class="primary" onclick="publishExisting('${post.id}')">📤 Publish</button>` : 
            ''}
          <button class="danger" onclick="deletePost('${post.id}')">🗑️ Delete</button>
        </div>
      `;
      
      postListEl.appendChild(div);
    });
  } catch (error) {
    console.error("Load posts error:", error);
    postListEl.innerHTML = `<div class="error">Failed to load posts: ${error.message}</div>`;
  }
}

function clearForm() {
  titleEl.value = "";
  slugEl.value = "";
  categoryEl.value = "";
  featuredEl.value = "";
  excerptEl.value = "";
  contentEl.value = "";
  currentEditId = null;
  updatePreview();
  showMessage("Form cleared");
}

/* ================= INITIALIZATION ================= */

// Update UI based on login state
updateAuthUI();

// Load posts if already logged in
if (TOKEN) {
  loadPosts();
} else {
  postListEl.innerHTML = '<div class="loading">Please login to view posts</div>';
}

// Make functions globally available for onclick handlers
window.saveDraft = saveDraft;
window.publish = publish;
window.loadPosts = loadPosts;
window.clearForm = clearForm;
window.editPost = editPost;
window.deletePost = deletePost;
window.publishExisting = publishExisting;
window.showLoginModal = showLoginModal;
window.closeLoginModal = closeLoginModal;
window.handleLogin = handleLogin;
window.logout = logout;

</script>

</body>
</html>
