<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Publish Article — myPilotPost</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --bg:#f8fafc;
  --text:#0f172a;
  --muted:#475569;
  --border:#e2e8f0;
  --radius:8px;
}
* { font-family:'Inter',sans-serif; box-sizing:border-box; }
body { margin:0; background:var(--bg); padding:2rem; }
h1 { font-size:2rem; color:var(--text); margin-bottom:1.5rem; }
.card {
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:1.5rem;
  max-width:900px;
}
input, textarea {
  width:100%;
  padding:0.75rem;
  border:1px solid var(--border);
  border-radius:var(--radius);
  font-size:14px;
  margin-bottom:1rem;
}
textarea { min-height:250px; resize:vertical; }
button {
  padding:0.6rem 1.2rem;
  border:none;
  border-radius:var(--radius);
  font-weight:600;
  cursor:pointer;
  margin-right:0.5rem;
}
.btn-primary { background:var(--blue); color:white; }
.btn-primary:hover { background:var(--blue-dark); }
.btn-secondary { background:white; border:1px solid var(--border); color:var(--muted); }
.status { margin-top:1rem; font-size:14px; }
.success { color:#10b981; }
.error { color:#ef4444; }
.info { color:#2563eb; }
</style>
</head>

<body>

<h1>Publish Article</h1>

<div class="card">

<input id="title" placeholder="Article Title" />
<input id="slug" placeholder="Slug (auto-generated if empty)" />
<input id="excerpt" placeholder="Short excerpt..." />
<input id="seoTitle" placeholder="SEO Title" />
<input id="seoDescription" placeholder="SEO Description" />
<input id="featuredImage" placeholder="Featured Image URL" />
<textarea id="content" placeholder="Write your article in HTML..."></textarea>

<button class="btn-secondary" onclick="saveDraft()">Save Draft</button>
<button class="btn-secondary" onclick="markReady()">Mark Ready</button>
<button class="btn-primary" onclick="publishNow()">Publish Now</button>

<div id="status" class="status"></div>

</div>

<script>
let articleId = null;

/* AUTO DETECT API */
const API_BASE = window.location.hostname.includes("localhost")
  ? "http://127.0.0.1:8787"
  : "https://api.mypilotpost.com";

/* GET TOKEN */
const token = localStorage.getItem("token");

if (!token) {
  console.warn("No JWT token found in localStorage");
  showStatus("Not logged in. Please login first.", "error");
}

function slugify(text) {
  return text.toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}

function collectData() {
  let title = document.getElementById("title").value.trim();
  let slug = document.getElementById("slug").value.trim();
  if (!slug) slug = slugify(title);

  return {
    title,
    slug,
    excerpt: document.getElementById("excerpt").value.trim(),
    seo_title: document.getElementById("seoTitle").value.trim(),
    seo_description: document.getElementById("seoDescription").value.trim(),
    featured_image_url: document.getElementById("featuredImage").value.trim(),
    content_html: document.getElementById("content").value.trim()
  };
}

function authHeaders() {
  return {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${token}`
  };
}

async function saveDraft() {
  try {
    const payload = collectData();
    if (!payload.title || !payload.content_html)
      return showStatus("Title and content required.", "error");

    let res;

    if (!articleId) {
      res = await fetch(`${API_BASE}/api/customer/content/blog`, {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Create failed");
      articleId = data.id;
      console.log("Created article:", articleId);
      showStatus("Draft created.", "success");
    } else {
      res = await fetch(`${API_BASE}/api/customer/content/blog/${articleId}`, {
        method: "PATCH",
        headers: authHeaders(),
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Update failed");
      showStatus("Draft updated.", "success");
    }
  } catch (err) {
    console.error(err);
    showStatus(err.message, "error");
  }
}

async function markReady() {
  if (!articleId) return showStatus("Save draft first.", "error");

  try {
    const res = await fetch(`${API_BASE}/api/customer/content/blog/${articleId}/ready`, {
      method: "POST",
      headers: authHeaders()
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Mark ready failed");
    showStatus("Marked as ready.", "info");
  } catch (err) {
    console.error(err);
    showStatus(err.message, "error");
  }
}

async function publishNow() {
  if (!articleId) return showStatus("Save draft first.", "error");

  try {
    let res = await fetch(`${API_BASE}/api/customer/content/blog/${articleId}/publish`, {
      method: "POST",
      headers: authHeaders()
    });

    /* Fallback if publish route not implemented */
    if (res.status === 404) {
      console.warn("Publish endpoint missing. Falling back to schedule.");
      res = await fetch(`${API_BASE}/api/customer/content/blog/${articleId}/schedule`, {
        method: "POST",
        headers: authHeaders()
      });
    }

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Publish failed");

    showStatus("Article published successfully!", "success");

  } catch (err) {
    console.error(err);
    showStatus(err.message, "error");
  }
}

function showStatus(message, type) {
  const el = document.getElementById("status");
  el.className = `status ${type}`;
  el.innerText = message;
}
</script>

</body>
</html>
