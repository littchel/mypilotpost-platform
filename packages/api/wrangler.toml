name = "mypilotpost-api"
account_id = "2e36b917221c87af13a139c07842b5b2"
main = "src/server.js"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2025-01-01"

[vars]
BASE_URL = "https://api.mypilotpost.com"
FRONTEND_URL = "https://app.mypilotpost.com"
ENVIRONMENT = "production"
API_VERSION = "v1"
# OAuth canonical origins
PUBLIC_API_BASE = "https://api.mypilotpost.com"
API_BASE_URL = "https://api.mypilotpost.com"
APP_BASE_URL = "https://app.mypilotpost.com"
# R2 bucket name string (used in DB records, separate from the bucket binding)
MEDIA_BUCKET_NAME = "mypilotpost-media"
# Promotions multiplier
REWARD_MULTIPLIER = "1"
# OAuth client IDs (non-secret, public)
# GOOGLE_CLIENT_ID is shared across ALL Google providers:
#   google, google_drive, google_analytics, google_business, youtube, google_search_console
# Required secret (wrangler secret put): GOOGLE_CLIENT_SECRET
# Authorized redirect URIs that must be registered in Google Cloud Console:
#   https://api.mypilotpost.com/api/oauth/google/callback
#   https://api.mypilotpost.com/api/oauth/google_drive/callback
#   https://api.mypilotpost.com/api/oauth/google_analytics/callback
#   https://api.mypilotpost.com/api/oauth/google_business/callback
#   https://api.mypilotpost.com/api/oauth/youtube/callback
#   https://api.mypilotpost.com/api/oauth/google_search_console/callback
GOOGLE_CLIENT_ID = "626126586204-kpm1sra6t8488t47an9m4ta030615c8s.apps.googleusercontent.com"
DROPBOX_CLIENT_ID = "yt1hvspft36igsa"
LINKEDIN_CLIENT_ID = "771mxvzllsxgrp"

# Primary D1 binding used by getDB(env)
[[d1_databases]]
binding = "mypilotpost"
database_name = "mypilotpost"
database_id = "e8075c44-5b6a-40c4-91cb-ebaef3da2a82"

# Alias binding so blog/billing/admin modules using env.DB resolve to same database
[[d1_databases]]
binding = "DB"
database_name = "mypilotpost"
database_id = "e8075c44-5b6a-40c4-91cb-ebaef3da2a82"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "mypilotpost-media"
preview_bucket_name = "mypilotpost-media-preview"

[[kv_namespaces]]
binding = "OAUTH_STATE"
id = "8ec7110460ae435a86e33999c115eec3"
preview_id = "af2c556897934423bb0da6d8ba106cac"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "665f55c4257b425ca8742d1bb3dd1cca"

[env.dev.vars]
FRONTEND_URL = "http://localhost:3000"
BASE_URL = "https://mypilotpost-api.littchel.workers.dev"
ENVIRONMENT = "development"

[triggers]
crons = ["* * * * *", "0 3 * * *", "0 */4 * * *"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "SupportChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SupportChatRoom"]
