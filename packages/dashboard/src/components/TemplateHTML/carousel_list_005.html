<div style="width:280px;height:350px;border-radius:16px;overflow:hidden;background:{{primary_color}};font-family:'{{font_headline}}',sans-serif;position:relative;box-shadow:0 4px 20px rgba(0,0,0,0.1);">
  <img src="{{image_url}}" style="width:100%;height:65%;object-fit:cover;position:absolute;top:0;left:0;" onerror="this.style.display='none'" />
  <div style="position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:4px;padding:0 16px;z-index:10;">
    <div style="flex:1;height:3px;background:white;border-radius:2px;"></div>
    <div style="flex:1;height:3px;background:rgba(255,255,255,0.4);border-radius:2px;"></div>
    <div style="flex:1;height:3px;background:rgba(255,255,255,0.4);border-radius:2px;"></div>
    <div style="flex:1;height:3px;background:rgba(255,255,255,0.4);border-radius:2px;"></div>
    <div style="flex:1;height:3px;background:rgba(255,255,255,0.4);border-radius:2px;"></div>
  </div>
  <div style="position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,0.85) 30%);">
    <span style="color:{{secondary_color}};font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">Slide 1 of 5</span>
    <h3 style="color:white;font-size:16px;margin:4px 0 0;font-weight:700;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,0.4);">{{headline}}</h3>
    <div style="display:inline-block;margin-top:10px;padding:4px 16px;background:{{secondary_color}};border-radius:20px;color:white;font-size:11px;font-weight:600;">Swipe for more</div>
  </div>
  <img src="{{logo_url}}" style="position:absolute;top:20px;right:12px;width:22px;height:22px;object-fit:contain;border-radius:50%;background:rgba(255,255,255,0.9);padding:2px;" onerror="this.style.display='none'" />
</div>
