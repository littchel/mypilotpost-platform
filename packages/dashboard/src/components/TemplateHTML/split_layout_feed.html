<div style="width:280px;height:280px;border-radius:16px;overflow:hidden;background:{{primary_color}};font-family:'{{font_headline}}',sans-serif;position:relative;box-shadow:0 4px 20px rgba(0,0,0,0.1);display:flex;">
  <div style="width:50%;height:100%;position:relative;">
    <img src="{{image_url}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'" />
  </div>
  <div style="width:50%;height:100%;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;background:{{primary_color}};">
    <h3 style="color:white;font-size:14px;margin:0;font-weight:700;line-height:1.3;">{{headline}}</h3>
    <p style="color:rgba(255,255,255,0.8);font-size:10px;margin:6px 0 0;line-height:1.3;">{{body}}</p>
    <div style="display:inline-block;margin-top:10px;padding:3px 10px;background:{{secondary_color}};border-radius:12px;color:white;font-size:9px;font-weight:600;align-self:flex-start;">{{cta}}</div>
  </div>
  <img src="{{logo_url}}" style="position:absolute;top:8px;right:8px;width:20px;height:20px;object-fit:contain;border-radius:50%;background:rgba(255,255,255,0.9);padding:2px;" onerror="this.style.display='none'" />
</div>
