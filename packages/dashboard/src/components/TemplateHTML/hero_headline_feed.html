<div style="width:280px;height:280px;border-radius:16px;overflow:hidden;background:{{primary_color}};font-family:'{{font_headline}}',sans-serif;position:relative;box-shadow:0 4px 20px rgba(0,0,0,0.1);">
  <img src="{{image_url}}" style="width:100%;height:70%;object-fit:cover;position:absolute;top:0;left:0;" onerror="this.style.display='none'" />
  <div style="position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,0.8));">
    <h3 style="color:white;font-size:18px;margin:0;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,0.5);">{{headline}}</h3>
    <p style="color:rgba(255,255,255,0.85);font-size:12px;margin:4px 0 0;text-shadow:0 1px 2px rgba(0,0,0,0.5);">{{body}}</p>
    <div style="display:inline-block;margin-top:8px;padding:4px 16px;background:{{secondary_color}};border-radius:20px;color:white;font-size:11px;font-weight:600;">{{cta}}</div>
  </div>
  <img src="{{logo_url}}" style="position:absolute;top:8px;right:8px;width:24px;height:24px;object-fit:contain;border-radius:50%;background:rgba(255,255,255,0.9);padding:2px;" onerror="this.style.display='none'" />
</div>
