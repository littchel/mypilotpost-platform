<div style="width:280px;height:350px;border-radius:16px;overflow:hidden;background:{{primary_color}};font-family:'{{font_headline}}',sans-serif;position:relative;box-shadow:0 4px 20px rgba(0,0,0,0.1);display:flex;flex-direction:column;">
  <div style="width:100%;height:50%;position:relative;">
    <img src="{{image_url}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'" />
    <img src="{{logo_url}}" style="position:absolute;top:12px;left:12px;width:20px;height:20px;object-fit:contain;border-radius:50%;background:white;padding:2px;" onerror="this.style.display='none'" />
  </div>
  <div style="width:100%;height:50%;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;background:{{primary_color}};">
    <h3 style="color:white;font-size:15px;margin:0;font-weight:700;text-align:center;line-height:1.3;">{{headline}}</h3>
    <p style="color:rgba(255,255,255,0.8);font-size:11px;margin:6px 0 0;text-align:center;line-height:1.3;">{{body}}</p>
    <div style="margin-top:12px;padding:4px 16px;background:{{secondary_color}};border-radius:14px;color:white;font-size:10px;font-weight:700;">{{cta}}</div>
  </div>
</div>
