<div style="width:280px;height:280px;border-radius:16px;overflow:hidden;background:{{primary_color}};font-family:'{{font_headline}}',sans-serif;position:relative;box-shadow:0 4px 20px rgba(0,0,0,0.1);padding:14px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <h4 style="color:white;font-size:11px;margin:0;font-weight:600;text-transform:uppercase;">Showcase</h4>
    <img src="{{logo_url}}" style="width:20px;height:20px;object-fit:contain;border-radius:50%;background:rgba(255,255,255,0.9);padding:2px;" onerror="this.style.display='none'" />
  </div>
  <div style="flex:1;border-radius:8px;overflow:hidden;position:relative;margin-bottom:8px;">
    <img src="{{image_url}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'" />
  </div>
  <div>
    <h3 style="color:white;font-size:13px;margin:0;font-weight:700;line-height:1.2;">{{headline}}</h3>
    <div style="display:inline-block;margin-top:6px;padding:3px 12px;background:{{secondary_color}};border-radius:12px;color:white;font-size:9px;font-weight:600;">{{cta}}</div>
  </div>
</div>
