<div style="width:280px;height:350px;border-radius:16px;overflow:hidden;background:{{primary_color}};font-family:'{{font_headline}}',sans-serif;position:relative;box-shadow:0 4px 20px rgba(0,0,0,0.1);">
  <img src="{{image_url}}" style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;" onerror="this.style.display='none'" />
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.1) 60%,rgba(0,0,0,0.7));"></div>
  <div style="position:absolute;top:16px;left:16px;display:flex;align-items:center;gap:8px;">
    <img src="{{logo_url}}" style="width:24px;height:24px;object-fit:contain;border-radius:50%;background:white;padding:2px;" onerror="this.style.display='none'" />
    <span style="color:white;font-size:11px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,0.6);">myPilotPost</span>
  </div>
  <div style="position:absolute;bottom:24px;left:16px;right:16px;display:flex;flex-direction:column;align-items:center;">
    <h3 style="color:white;font-size:16px;margin:0;font-weight:700;text-align:center;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,0.6);">{{headline}}</h3>
    <p style="color:rgba(255,255,255,0.9);font-size:11px;margin:6px 0 0;text-align:center;line-height:1.3;text-shadow:0 1px 2px rgba(0,0,0,0.6);">{{body}}</p>
    <div style="margin-top:12px;padding:6px 20px;background:{{secondary_color}};border-radius:20px;color:white;font-size:10px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,0.2);text-transform:uppercase;letter-spacing:0.5px;">{{cta}}</div>
  </div>
</div>
