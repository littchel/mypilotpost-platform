<div style="width:280px;height:280px;border-radius:16px;overflow:hidden;background:{{secondary_color}};font-family:'{{font_headline}}',sans-serif;position:relative;box-shadow:0 4px 20px rgba(0,0,0,0.1);display:flex;flex-direction:column;justify-content:space-between;padding:24px;box-sizing:border-box;border:1px solid rgba(0,0,0,0.06);">
  <img src="{{logo_url}}" style="width:24px;height:24px;object-fit:contain;" onerror="this.style.display='none'" />
  <div>
    <div style="width:24px;height:3px;background:{{primary_color}};margin-bottom:12px;"></div>
    <h3 style="color:{{primary_color}};font-size:18px;margin:0;font-weight:800;line-height:1.3;">{{headline}}</h3>
    <p style="color:rgba(0,0,0,0.6);font-size:11px;margin:8px 0 0;line-height:1.4;">{{body}}</p>
  </div>
  <div style="font-size:11px;font-weight:700;color:{{primary_color}};text-transform:uppercase;letter-spacing:0.5px;">{{cta}} →</div>
</div>
