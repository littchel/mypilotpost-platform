<div style="width:280px;height:280px;border-radius:16px;overflow:hidden;background:{{primary_color}};font-family:'{{font_headline}}',sans-serif;position:relative;box-shadow:0 4px 20px rgba(0,0,0,0.1);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;box-sizing:border-box;">
  <span style="position:absolute;top:10px;left:20px;font-size:80px;color:rgba(255,255,255,0.15);font-family:serif;line-height:1;">“</span>
  <h3 style="color:white;font-size:16px;margin:0;font-weight:700;text-align:center;line-height:1.4;z-index:2;">{{headline}}</h3>
  <p style="color:rgba(255,255,255,0.7);font-size:12px;margin:12px 0 0;text-align:center;font-weight:300;z-index:2;">{{body}}</p>
  <img src="{{logo_url}}" style="position:absolute;bottom:16px;width:24px;height:24px;object-fit:contain;border-radius:50%;background:rgba(255,255,255,0.9);padding:2px;" onerror="this.style.display='none'" />
</div>
