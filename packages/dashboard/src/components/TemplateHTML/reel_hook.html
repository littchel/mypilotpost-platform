<div style="width:280px;height:350px;border-radius:16px;overflow:hidden;background:{{primary_color}};font-family:'{{font_headline}}',sans-serif;position:relative;box-shadow:0 4px 20px rgba(0,0,0,0.1);">
  <img src="{{image_url}}" style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;" onerror="this.style.display='none'" />
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.35);"></div>
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;padding:16px;background:rgba(255,255,255,0.95);border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.25);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;">
    <span style="font-size:10px;color:{{primary_color}};font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Trending Hook</span>
    <h3 style="color:#0F172A;font-size:13px;margin:0;font-weight:800;text-align:center;line-height:1.3;">{{headline}}</h3>
  </div>
  <div style="position:absolute;bottom:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:6px;">
      <img src="{{logo_url}}" style="width:20px;height:20px;object-fit:contain;border-radius:50%;background:white;padding:2px;" onerror="this.style.display='none'" />
      <span style="color:white;font-size:9px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,0.8);">{{cta}}</span>
    </div>
    <div style="font-size:12px;color:white;">▶ Video</div>
  </div>
</div>
